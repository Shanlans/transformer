name: torch2.5
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.9
  
  # PyTorch ecosystem
  - pytorch=2.2.2
  - torchvision=0.17.2
  - torchaudio=2.2.2
  - pytorch-cuda=11.8  # For CUDA support (optional)
  
  # Core scientific computing
  - numpy<2.0
  - scipy
  - matplotlib>=3.5.0
  - pandas>=1.3.0
  - scikit-learn>=1.0.0
  
  # Jupyter and development tools
  - jupyter>=1.0.0
  - ipykernel
  - ipywidgets
  
  # System dependencies
  - pip
  - git
  
  # Additional packages via pip
  - pip:
    # PyTorch utilities
    - torchsummary>=1.5.1
    - torchinfo>=1.7.0
    
    # Training utilities
    - tqdm>=4.64.0
    - tensorboard>=2.8.0
    - wandb>=0.12.0
    
    # Visualization
    - seaborn>=0.11.0
    - plotly>=5.0.0
    
    # Google Cloud integration (optional)
    - google-cloud-storage>=2.10.0
    - google-auth>=2.17.0
    - colabcode>=0.1.0
    
    # Additional utilities
    - filelock==3.13.1
    - typing-extensions==4.12.2
    - sympy==1.13.3
    - networkx==3.3
    - jinja2==3.1.4
    - fsspec==2024.6.1
    - pillow==11.0.0
    - MarkupSafe==2.1.5
    - mpmath==1.3.0
